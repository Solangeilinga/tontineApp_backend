name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Vérifier la syntaxe (node -c) de tous les fichiers source
        run: find src -name "*.js" -print0 | xargs -0 -n1 node -c

      - name: Lancer les tests
        run: npm test
